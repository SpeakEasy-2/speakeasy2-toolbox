name: Test toolbox

on:
  - workflow_call

jobs:
  test:
    name: Test on different OSes
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: everything

      - name: Remove everything but the tests
        run: |
          mv everything/tests .
          rm -rf everything

      - name: Collect toolbox
        uses: actions/download-artifact@v4
        with:
          name: SpeakEasy2-toolbox-${{ github.sha }}
          path: release

      # Strip version from the toolbox name so it's easier to install.
      - name: Rename toolbox
        run: mv release/speakeasy2*.mltbx release/speakeasy2.mltbx

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Download matlab-igraph dependency
        run: |
          curl -L $(curl -s https://api.github.com/repos/DavidRConnell/matlab-igraph/releases/latest | \
          jq -r '.assets[] | select(.name | endswith(".mltbx")) | .browser_download_url') > release/matlab-igraph.mltbx

      - name: Install toolboxes
        uses: matlab-actions/run-command@v2
        with:
          command: for tlbx = dir("release/*.mltbx")'; matlab.addons.toolbox.installToolbox(fullfile(tlbx.folder, tlbx.name), true); end

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Upload test results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always() && runner.os == 'Windows'
        with:
          check_name: Windows Test Results
          files: test-results/results.xml

      - name: Upload test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && runner.os == 'Linux'
        with:
          check_name: Linux Test Results
          files: test-results/results.xml

      - name: Upload test results
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always() && runner.os == 'macOS'
        with:
          check_name: macOS Arm Test Results
          files: test-results/results.xml

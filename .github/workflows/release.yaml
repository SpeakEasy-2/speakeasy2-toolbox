name: Build and test toolboxes

on:
  push:
    branches:
      - devel
      - add-tests # Temporary
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  build-toolbox:
    uses: ./.github/workflows/build.yaml

  test-toolbox:
    needs: build-toolbox
    uses: ./.github/workflows/test.yaml
